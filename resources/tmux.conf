# Revive's own tmux server: `tmux -L revive -f <this file>`.
# Passing -f means ~/.tmux.conf and /etc/tmux.conf are never read, and the
# separate socket means the user's own tmux sessions are never touched.

set -g status off
set -sg escape-time 0
set -g history-limit 50000
set -g default-terminal "xterm-256color"
set -g window-size latest

# No prefix and no key bindings: every keystroke goes to the agent or shell.
set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix
unbind-key -a -T root
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi
set -g mouse off

# Plain output: no alternate screen for the client, so what scrolls off
# lands in the viewer's own scrollback.
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'

# Revive decides when a session ends; tmux doesn't rename or keep dead panes.
set -g allow-rename off
set -g automatic-rename off
set -g remain-on-exit off
set -g set-titles off
set -g focus-events on
set -g exit-empty on
